# Part 3 (O-level). One workflow, four stages, each gated on the last:
#
#     build -> validate -> deploy -> smoke test -> archive
#
# validate runs before anything is published, so a broken site never reaches
# the live URL. smoke test runs after, because a deploy can succeed and still
# leave the previous build in place - and that failure answers HTTP 200.
#
# Assignment 9 hardening (verified with zizmor):
#   * every action is pinned to a full commit SHA, with the tag as a comment
#     so Dependabot can still propose upgrades;
#   * the workflow grants nothing by default, and each job asks only for the
#     permission it uses - the job that runs a third-party Jekyll build can no
#     longer write releases or mint a Pages OIDC token;
#   * checkout does not leave the token in .git/config;
#   * expressions reach shell scripts through env, never pasted into `run:`.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never let two deploys race. cancel-in-progress stays false: cancelling a
# half-finished deploy is how you end up serving a mixture of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Stamp this build with the commit it was made from
        run: |
          echo "$GITHUB_SHA" > version.txt
          echo "Stamped version.txt with $GITHUB_SHA"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Gate - validate the built site
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/validate_site.py _site

      - name: Archive the built site so it can be rolled back to
        run: |
          cd _site
          zip -qr "../site-${GITHUB_SHA::7}.zip" .
          cd ..
          ls -la site-*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-zip
          path: site-*.zip
          retention-days: 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the artifact
      id-token: write   # deploy-pages proves its identity to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  smoke:
    name: Smoke test the live site
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Does the live URL serve this exact build?
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/smoke_test.py "$PAGE_URL" "$GITHUB_SHA"

  archive:
    name: Publish a rollback point
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that may create a release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-zip

      # A release, not a workflow artifact. Pages artifacts expire after a day,
      # which is exactly when you would want to roll back to one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="site-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$tag" site-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Deploy of ${GITHUB_SHA} verified live by the smoke test in run ${GITHUB_RUN_ID}."
          echo "Rollback point: $tag"
